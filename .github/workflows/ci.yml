name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests bin/check-framework bin/check-release
      - run: ruff format --check src tests bin/check-framework bin/check-release
      - run: mypy src
      - run: python -m pw_foundation.guards
      - run: python bin/check-framework
      - run: pytest
