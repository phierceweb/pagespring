name: publish
on:
  push:
    tags: ["v*"]
jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests bin/check-framework bin/check-release
      - run: ruff format --check src tests bin/check-framework bin/check-release
      - run: mypy src
      - run: python -m pf_core.guards
      - run: python bin/check-framework
      - run: pytest
  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The tag is what triggers the publish, so it — not the source tree — is
      # what would ship under the wrong version or release notes.
      - name: Tag, packaged version and CHANGELOG agree
        run: python bin/check-release "${GITHUB_REF_NAME}"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
